name: weekly
on:
  push:
    branches: [main]
  schedule:
    # 매주 월요일 08:41 KST (일요일 23:41 UTC). 정각은 전 세계 크론이 몰려 밀리므로 피한다.
    - cron: "41 23 * * 0"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install jinja2
      - name: 가격 수집 (크론·수동 실행 때만. push 는 기존 데이터로 빌드)
        if: github.event_name != 'push'
        run: TZ=Asia/Seoul python crawl.py
      - name: 수집 결과를 main 에 저장
        if: github.event_name != 'push'
        run: |
          git config user.name "altteulgudok-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "주간 가격 수집 $(TZ=Asia/Seoul date +%F)"
          git push
      - run: TZ=Asia/Seoul python build.py
      - name: dist 브랜치로 배포 (Cloudflare Pages 가 이 브랜치를 봅니다)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: dist
